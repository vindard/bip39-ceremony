# Core per-PR gate: the same checks enforced locally by `just check`,
# run reproducibly through the pinned Nix devShell on both supported OSes.
#
# Actions are pinned to immutable commits; Dependabot only proposes revisions
# after the repository's dependency cooldown.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: bip39-ceremony
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Guix syntax lint needs the Guix binary, which is Linux-only, so macOS
      # runs the same gate minus that one recipe.
      - name: just check (Linux — full gate)
        if: runner.os == 'Linux'
        run: nix develop --command just check
      - name: just check (macOS — Guix syntax lint is Linux-only)
        if: runner.os == 'macOS'
        run: nix develop --command just fmt-check lint test package-lint privacy-lint architecture-lint dependency-policy-test dependency-policy-lint guix-lock-lint
      - name: Dependency update isolation
        if: github.event_name == 'pull_request'
        run: nix develop --command python3 scripts/dependency-policy-lint.py --base-ref "${{ github.event.pull_request.base.sha }}"

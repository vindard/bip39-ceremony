# Core per-PR gate: the same checks enforced locally by `just check`,
# run reproducibly through the pinned Nix devShell on both supported OSes.
#
# Actions are tag-pinned for the initial scaffold; the committed Dependabot
# config keeps them current (and can migrate them to commit-SHA pins).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: bip39-ceremony
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Guix syntax lint needs the Guix binary, which is Linux-only, so macOS
      # runs the same gate minus that one recipe.
      - name: just check (Linux — full gate)
        if: runner.os == 'Linux'
        run: nix develop --command just check
      - name: just check (macOS — Guix syntax lint is Linux-only)
        if: runner.os == 'macOS'
        run: nix develop --command just fmt-check lint test package-lint privacy-lint architecture-lint guix-lock-lint

# Supply-chain posture: RustSec advisories, license/source/ban policy
# (`just security` = cargo-audit + cargo-deny), plus PR dependency review.
# Runs on every PR AND daily, so a newly disclosed advisory turns the badge
# red even without a code change.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 6 * * *" # daily at 06:27 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit + deny
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: bip39-ceremony
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: just security
        run: nix develop --command just security

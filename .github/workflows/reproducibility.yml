# Reproducibility + upstream reference validation.
#
# `nix flake check` builds every pinned derivation and runs the flake `checks`:
# the eight upstream reference comparisons (Coldcard, SeedSigner, Krux, BitBox02,
# Keystone, Jade, Ian Coleman) plus the static/dynamic release artifacts and
# their PTY smoke tests. Every upstream revision is pinned by flake.lock, so a
# green run is per-PR proof that our output still matches the real wallet code.
#
# This is the heavy job: without Cachix it rebuilds libwally, the Node runner
# and the Rust adapters every time. Configure the cache before relying on it.
name: Reproducibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: bip39-ceremony
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Verify flake inputs are locked
        run: nix flake metadata --no-update-lock-file
      - name: nix flake check
        run: nix flake check --print-build-logs
